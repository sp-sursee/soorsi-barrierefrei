{%- assign s = site.data.site -%}
{% if s.banner and s.banner != "" %}
<div class="banner" id="banner" role="region" aria-label="Hinweis">
    <div class="wrap banner-inner">
        <p>{{ s.banner }}{% if s.banner_link_url and s.banner_link_url != "" %} <a href="{% include url.html url=s.banner_link_url %}">{{ s.banner_link_label | default: "Mehr erfahren" }}</a>{% endif %}</p>
        <button type="button" class="banner-close" id="banner-close" aria-label="{{ s.texts.banner_close | default: 'Hinweis schliessen' }}">{% include icon.html name="schliessen" %}</button>
    </div>
</div>
<script>
    (function () {
        var banner = document.getElementById("banner");
        document.getElementById("banner-close").addEventListener("click", function () { banner.hidden = true; });
    })();
</script>
{% endif %}
