title: Soorsi Barrierefrei
lang: de-CH

# NOTE: The editable site texts (title, description, email, banner) live in
# _data/site.yml, which is what the Pages CMS writes to. Keep them there, NOT
# here: the CMS rewrites the file it manages with only the fields it knows about,
# so anything extra in that file gets silently dropped. This file is intentionally
# NOT managed by the CMS, so the structural config below is safe from that.
#
# baseurl is set by the GitHub Pages workflow (--baseurl), so all internal links
# must go through the relative_url filter.
#
# url is the local default. The deploy workflow overrides it with the real
# origin from actions/configure-pages via a generated _config.ci.yml, so
# canonical links, og:image, sitemap and JSON-LD carry absolute production URLs.
url: "http://localhost:4000"

# Widths of the downscaled copies that script/images writes next to every image
# in assets/images. The hero <img> srcset is built from the same list.
responsive_widths: [800, 1200, 1600]

# Extra pages ("Weitere Seiten" in the CMS), one file per page in _seiten/.
# Every published page appears in the main menu (_includes/nav.html);
# published: false keeps a draft out of the build, the menu and the sitemap.
collections:
  seiten:
    output: true
    permalink: /:name/

exclude:
  - "fllyer_barrierefrei_v5 Ordner"
  - "flyer_barrierefrei_v5 Ordner.zip"
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .claude
  - script
  - _config.ci.yml

# Layouts are assigned here (not in each page's front matter) so the Pages CMS,
# which only writes back the fields it knows about, can never strip a page's layout.
defaults:
  - scope:
      path: ""
    values:
      layout: default
  # robots.txt and sitemap.xml are plain text/XML and must not be wrapped in HTML.
  - scope:
      path: "robots.txt"
    values:
      layout: null
  - scope:
      path: "sitemap.xml"
    values:
      layout: null
